id: ssc-debricked
version: "1"
description: Emit high or critical Debricked findings. This is open-source evidence, not an exploit verdict.
enabled: true
platforms: [ssc]
when:
  all:
    - classification: ssc-debricked
      equals: true
    - field: finding.severity
      in: [Critical, High]
    - field: finding.suppressed
      equals: false
emit:
  type: ssc-open-source-high
  confidence: medium
  severity_from: finding.severity
  title: High-severity open source finding
